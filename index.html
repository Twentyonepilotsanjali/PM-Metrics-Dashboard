<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Metrics – HnA Systems</title>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Recharts -->
  <script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <!-- Babel Standalone (JSX transpiler) -->
  <script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f4f4f6; }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    @media (max-width: 640px) {
      .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;
    const {
      AreaChart, Area, XAxis, YAxis, CartesianGrid,
      Tooltip, ResponsiveContainer
    } = Recharts;

    const mauData = [
      { month: "Jan", mau: 14200 },
      { month: "Feb", mau: 15800 },
      { month: "Mar", mau: 17400 },
      { month: "Apr", mau: 19600 },
      { month: "May", mau: 22100 },
      { month: "Jun", mau: 24500 },
    ];

    const rangeMonths = { "1M": 1, "3M": 3, "6M": 6 };

    const features = [
      { name: "Dark mode",  votes: 342, effort: "Low",  status: "Shipped"  },
      { name: "API access", votes: 287, effort: "High", status: "Building" },
      { name: "CSV export", votes: 198, effort: "Med",  status: "Backlog"  },
      { name: "Mobile app", votes: 451, effort: "High", status: "Building" },
      { name: "SSO / SAML", votes: 174, effort: "Med",  status: "Shipped"  },
    ];

    const statusStyles = {
      Shipped:  { background: "#e8f5e9", color: "#2e7d32" },
      Building: { background: "#ede7f6", color: "#512da8" },
      Backlog:  { background: "#f5f5f5", color: "#757575" },
    };

    const filters = ["All", "Shipped", "Building", "Backlog"];

    const PURPLE = "#534AB7";
    const GREEN  = "#2e7d32";
    const CORAL  = "#c0392b";

    function KPICard({ label, value, delta, direction, accentColor }) {
      const [hovered, setHovered] = useState(false);
      const isGood = accentColor === GREEN;

      return (
        <div
          onMouseEnter={() => setHovered(true)}
          onMouseLeave={() => setHovered(false)}
          style={{
            background: hovered ? "#fafafa" : "#fff",
            border: "1px solid #e8e8e8",
            borderLeft: `3px solid ${accentColor}`,
            borderRadius: 12,
            padding: 16,
            display: "flex",
            flexDirection: "column",
            gap: 6,
            transition: "background 0.15s",
            cursor: "default",
          }}
        >
          <span style={{ fontSize: 12, color: "#424242", fontWeight: 500 }}>{label}</span>
          <span style={{ fontSize: 28, fontWeight: 700, color: "#111", lineHeight: 1 }}>{value}</span>
          <div style={{ display: "flex", alignItems: "center", gap: 4, marginTop: 2 }}>
            <span style={{
              display: "inline-flex", alignItems: "center", gap: 3,
              fontSize: 12, fontWeight: 600,
              color: isGood ? GREEN : CORAL,
              background: isGood ? "#e8f5e9" : "#fff0ee",
              borderRadius: 6, padding: "3px 8px",
            }}>
              {direction === "up" ? "↑" : "↓"} {delta}
            </span>
          </div>
        </div>
      );
    }

    function HnADashboard() {
      const [activeFilter, setActiveFilter] = useState("All");
      const [timeRange, setTimeRange]       = useState("6M");

      const chartData = mauData.slice(-rangeMonths[timeRange]);
      const mauValue  = chartData[chartData.length - 1].mau.toLocaleString();

      const kpis = [
        { label: "Monthly active users", value: mauValue, delta: "18%",   direction: "up",   accentColor: GREEN },
        { label: "Churn rate",           value: "3.2%",   delta: "0.4pp", direction: "down", accentColor: CORAL },
        { label: "NPS",                  value: "9",      delta: "3 pts", direction: "up",   accentColor: GREEN },
        { label: "MRR",                  value: "$182K",  delta: "23%",   direction: "up",   accentColor: GREEN },
      ];

      const filtered = features
        .filter((f) => activeFilter === "All" || f.status === activeFilter)
        .sort((a, b) => b.votes - a.votes);

      return (
        <div style={{
          minHeight: "100vh",
          background: "#f4f4f6",
          fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
        }}>

          {/* Header bar */}
          <div style={{
            background: "#fff",
            borderBottom: "1px solid #e8e8e8",
            padding: "0 24px",
            height: 56,
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
          }}>
            <span style={{ fontSize: 18, fontWeight: 700, color: "#111", letterSpacing: "-0.01em" }}>
              Product metrics – HnA Systems
            </span>
            <span style={{ fontSize: 12, color: "#9e9e9e" }}>
              June 2026 · Last updated: today
            </span>
          </div>

          {/* Page body */}
          <div style={{ padding: "24px", maxWidth: 1200, margin: "0 auto" }}>

            {/* KPI Cards */}
            <div className="kpi-grid">
              {kpis.map((kpi) => (
                <KPICard key={kpi.label} {...kpi} />
              ))}
            </div>

            {/* MAU Trend Chart */}
            <div style={{
              background: "#fff", border: "1px solid #e8e8e8",
              borderRadius: 12, padding: 16, marginBottom: 16,
            }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
                <span style={{ fontSize: 13, fontWeight: 600, color: "#212121" }}>MAU trend</span>
                <div style={{ display: "flex", gap: 4 }}>
                  {["1M", "3M", "6M"].map((r) => {
                    const active = timeRange === r;
                    return (
                      <button
                        key={r}
                        onClick={() => setTimeRange(r)}
                        style={{
                          fontSize: 12, fontWeight: 500,
                          padding: "3px 10px", borderRadius: 6,
                          border: "1px solid",
                          borderColor: active ? PURPLE : "#e8e8e8",
                          background: active ? PURPLE : "#fff",
                          color: active ? "#fff" : "#616161",
                          cursor: "pointer",
                          transition: "all 0.15s",
                        }}
                      >
                        {r}
                      </button>
                    );
                  })}
                </div>
              </div>
              <ResponsiveContainer width="100%" height={240}>
                <AreaChart data={chartData} margin={{ top: 4, right: 8, left: 0, bottom: 0 }}>
                  <defs>
                    <linearGradient id="mauFill" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="5%"  stopColor={PURPLE} stopOpacity={0.12} />
                      <stop offset="95%" stopColor={PURPLE} stopOpacity={0} />
                    </linearGradient>
                  </defs>
                  <CartesianGrid strokeDasharray="3 3" stroke="#f0f0f0" vertical={false} />
                  <XAxis
                    dataKey="month"
                    tick={{ fontSize: 12, fill: "#9e9e9e" }}
                    axisLine={false}
                    tickLine={false}
                  />
                  <YAxis
                    tick={{ fontSize: 12, fill: "#9e9e9e" }}
                    axisLine={false}
                    tickLine={false}
                    tickFormatter={(v) => `${(v / 1000).toFixed(0)}k`}
                    width={36}
                  />
                  <Tooltip
                    formatter={(v) => [v.toLocaleString(), "MAU"]}
                    contentStyle={{ fontSize: 12, borderRadius: 8, border: "1px solid #e8e8e8", boxShadow: "none" }}
                    labelStyle={{ color: "#212121", fontWeight: 600 }}
                  />
                  <Area
                    type="monotone"
                    dataKey="mau"
                    stroke={PURPLE}
                    strokeWidth={2.5}
                    fill="url(#mauFill)"
                    dot={false}
                    activeDot={{ r: 5, fill: PURPLE, strokeWidth: 0 }}
                  />
                </AreaChart>
              </ResponsiveContainer>
            </div>

            {/* Feature Request Table */}
            <div style={{
              background: "#fff", border: "1px solid #e8e8e8",
              borderRadius: 12, padding: 16,
            }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 14 }}>
                <span style={{ fontSize: 13, fontWeight: 600, color: "#212121" }}>Feature requests</span>
                <span style={{ fontSize: 11, color: "#9e9e9e" }}>{filtered.length} items</span>
              </div>

              <div style={{ display: "flex", gap: 8, marginBottom: 16, flexWrap: "wrap" }}>
                {filters.map((f) => {
                  const active = activeFilter === f;
                  return (
                    <button
                      key={f}
                      onClick={() => setActiveFilter(f)}
                      style={{
                        fontSize: 12, fontWeight: 500,
                        padding: "4px 12px", borderRadius: 20,
                        border: "1px solid",
                        borderColor: active ? PURPLE : "#e8e8e8",
                        background: active ? PURPLE : "#fff",
                        color: active ? "#fff" : "#616161",
                        cursor: "pointer",
                        transition: "all 0.15s",
                      }}
                    >
                      {f}
                    </button>
                  );
                })}
              </div>

              <table style={{ width: "100%", borderCollapse: "collapse" }}>
                <thead>
                  <tr style={{ borderBottom: "1px solid #f0f0f0" }}>
                    {["Feature", "Votes", "Effort", "Status"].map((col) => (
                      <th key={col} style={{
                        textAlign: "left", fontSize: 11, fontWeight: 600,
                        color: "#9e9e9e", paddingBottom: 10, paddingRight: 12,
                        letterSpacing: "0.04em",
                      }}>
                        {col.toUpperCase()}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filtered.map((f, i) => (
                    <tr
                      key={f.name}
                      style={{ borderBottom: i < filtered.length - 1 ? "1px solid #f5f5f5" : "none" }}
                    >
                      <td style={{ fontSize: 13, color: "#212121", fontWeight: 500, padding: "12px 12px 12px 0" }}>{f.name}</td>
                      <td style={{ fontSize: 13, color: "#424242", padding: "12px 12px 12px 0" }}>{f.votes}</td>
                      <td style={{ fontSize: 13, color: "#424242", padding: "12px 12px 12px 0" }}>{f.effort}</td>
                      <td style={{ padding: "12px 0" }}>
                        <span style={{
                          fontSize: 11, fontWeight: 600,
                          padding: "3px 10px", borderRadius: 20,
                          ...statusStyles[f.status],
                        }}>
                          {f.status}
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      React.createElement(HnADashboard)
    );
  </script>
</body>
</html>
