<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HnA Systems — Product Metrics</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#f4f4f6;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#111}
.header{background:#fff;border-bottom:1px solid #e8e8e8;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:18px;font-weight:700;letter-spacing:-0.01em}
.header-date{font-size:12px;color:#9e9e9e}
.body{padding:24px;max-width:1200px;margin:0 auto}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:640px){.kpi-grid{grid-template-columns:repeat(2,1fr)}}
.kpi-card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;transition:background .15s;cursor:default}
.kpi-card:hover{background:#fafafa}
.kpi-label{font-size:12px;color:#424242;font-weight:500}
.kpi-value{font-size:28px;font-weight:700;line-height:1}
.kpi-delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;border-radius:6px;padding:3px 8px}
.delta-good{color:#2e7d32;background:#e8f5e9}
.delta-bad{color:#c0392b;background:#fff0ee}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:16px;margin-bottom:16px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.card-title{font-size:13px;font-weight:600;color:#212121}
.range-btns{display:flex;gap:4px}
.range-btn{font-size:12px;font-weight:500;padding:3px 10px;border-radius:6px;border:1px solid #e8e8e8;background:#fff;color:#616161;cursor:pointer;transition:all .15s}
.range-btn.active{background:#534AB7;border-color:#534AB7;color:#fff}
.chart-wrap{width:100%;height:240px;position:relative}
svg.chart{width:100%;height:100%}
.filter-btns{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{font-size:12px;font-weight:500;padding:4px 12px;border-radius:20px;border:1px solid #e8e8e8;background:#fff;color:#616161;cursor:pointer;transition:all .15s}
.filter-btn.active{background:#534AB7;border-color:#534AB7;color:#fff}
.feat-count{font-size:11px;color:#9e9e9e}
table{width:100%;border-collapse:collapse}
thead tr{border-bottom:1px solid #f0f0f0}
th{text-align:left;font-size:11px;font-weight:600;color:#9e9e9e;padding-bottom:10px;padding-right:12px;letter-spacing:.04em}
td{font-size:13px;padding:12px 12px 12px 0;border-bottom:1px solid #f5f5f5}
tr:last-child td{border-bottom:none}
.status{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.status-shipped{background:#e8f5e9;color:#2e7d32}
.status-building{background:#ede7f6;color:#512da8}
.status-backlog{background:#f5f5f5;color:#757575}
</style>
</head>
<body>

<div class="header">
  <span class="header-title">Product metrics — HnA Systems</span>
  <span class="header-date">June 2026 · Last updated: today</span>
</div>

<div class="body">

  <!-- KPI Cards -->
  <div class="kpi-grid" id="kpi-grid"></div>

  <!-- MAU Chart -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">MAU trend</span>
      <div class="range-btns">
        <button class="range-btn" onclick="setRange('1M',this)">1M</button>
        <button class="range-btn" onclick="setRange('3M',this)">3M</button>
        <button class="range-btn active" onclick="setRange('6M',this)">6M</button>
      </div>
    </div>
    <div class="chart-wrap"><svg class="chart" id="chart" aria-label="MAU trend chart"></svg></div>
  </div>

  <!-- Feature Table -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Feature requests</span>
      <span class="feat-count" id="feat-count">5 items</span>
    </div>
    <div class="filter-btns">
      <button class="filter-btn active" onclick="setFilter('All',this)">All</button>
      <button class="filter-btn" onclick="setFilter('Shipped',this)">Shipped</button>
      <button class="filter-btn" onclick="setFilter('Building',this)">Building</button>
      <button class="filter-btn" onclick="setFilter('Backlog',this)">Backlog</button>
    </div>
    <table>
      <thead><tr><th>FEATURE</th><th>VOTES</th><th>EFFORT</th><th>STATUS</th></tr></thead>
      <tbody id="feat-body"></tbody>
    </table>
  </div>

</div>

<script>
var mauData=[
  {month:"Jan",mau:14200},
  {month:"Feb",mau:15800},
  {month:"Mar",mau:17400},
  {month:"Apr",mau:19600},
  {month:"May",mau:22100},
  {month:"Jun",mau:24500}
];

var features=[
  {name:"Dark mode",votes:342,effort:"Low",status:"Shipped"},
  {name:"API access",votes:287,effort:"High",status:"Building"},
  {name:"CSV export",votes:198,effort:"Med",status:"Backlog"},
  {name:"Mobile app",votes:451,effort:"High",status:"Building"},
  {name:"SSO / SAML",votes:174,effort:"Med",status:"Shipped"}
];

var currentRange="6M";
var currentFilter="All";

var kpis=[
  {label:"Monthly active users",value:null,delta:"18%",dir:"up",good:true,borderColor:"#2e7d32"},
  {label:"Churn rate",value:"3.2%",delta:"0.4pp",dir:"down",good:true,borderColor:"#2e7d32"},
  {label:"NPS",value:"9",delta:"3 pts",dir:"up",good:true,borderColor:"#2e7d32"},
  {label:"MRR",value:"$182K",delta:"23%",dir:"up",good:true,borderColor:"#2e7d32"}
];

function getChartData(){
  var n=currentRange==="1M"?1:currentRange==="3M"?3:6;
  return mauData.slice(-n);
}

function renderKPIs(){
  var data=getChartData();
  var mauVal=data[data.length-1].mau.toLocaleString();
  var grid=document.getElementById("kpi-grid");
  grid.innerHTML="";
  kpis.forEach(function(k,i){
    var val=i===0?mauVal:k.value;
    var div=document.createElement("div");
    div.className="kpi-card";
    div.style.borderLeft="3px solid "+k.borderColor;
    div.innerHTML=
      '<span class="kpi-label">'+k.label+'</span>'+
      '<span class="kpi-value">'+val+'</span>'+
      '<div><span class="kpi-delta '+(k.good?"delta-good":"delta-bad")+'">'+(k.dir==="up"?"↑":"↓")+' '+k.delta+'</span></div>';
    grid.appendChild(div);
  });
}

function renderChart(){
  var data=getChartData();
  var svg=document.getElementById("chart");
  var w=svg.clientWidth||600;
  var h=svg.clientHeight||240;
  var pad={top:10,right:20,bottom:30,left:44};
  var iw=w-pad.left-pad.right;
  var ih=h-pad.top-pad.bottom;
  var vals=data.map(function(d){return d.mau});
  var min=Math.min.apply(null,vals)*0.95;
  var max=Math.max.apply(null,vals)*1.02;
  var xs=data.map(function(d,i){return pad.left+i*(iw/(data.length-1||1))});
  var ys=data.map(function(d){return pad.top+ih-(d.mau-min)/(max-min)*ih});

  var pts=xs.map(function(x,i){return x+","+ys[i]}).join(" ");
  var areaPath="M"+xs[0]+","+ys[0]+" "+
    xs.map(function(x,i){return "L"+x+","+ys[i]}).slice(1).join(" ")+
    " L"+xs[xs.length-1]+","+(pad.top+ih)+" L"+xs[0]+","+(pad.top+ih)+" Z";

  var gridLines="";
  for(var t=0;t<=4;t++){
    var gy=pad.top+ih*(t/4);
    var gv=Math.round(max-(max-min)*(t/4));
    gridLines+='<line x1="'+pad.left+'" y1="'+gy+'" x2="'+(pad.left+iw)+'" y2="'+gy+'" stroke="#f0f0f0" stroke-width="1"/>';
    gridLines+='<text x="'+(pad.left-6)+'" y="'+(gy+4)+'" text-anchor="end" font-size="11" fill="#9e9e9e">'+Math.round(gv/1000)+'k</text>';
  }

  var xLabels=data.map(function(d,i){
    return '<text x="'+xs[i]+'" y="'+(pad.top+ih+18)+'" text-anchor="middle" font-size="11" fill="#9e9e9e">'+d.month+'</text>';
  }).join("");

  var dots=data.map(function(d,i){
    return '<circle cx="'+xs[i]+'" cy="'+ys[i]+'" r="4" fill="#534AB7" stroke="#fff" stroke-width="2"/>';
  }).join("");

  svg.innerHTML=
    '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="5%" stop-color="#534AB7" stop-opacity="0.12"/>'+
    '<stop offset="95%" stop-color="#534AB7" stop-opacity="0"/>'+
    '</linearGradient></defs>'+
    gridLines+
    '<path d="'+areaPath+'" fill="url(#g)"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="#534AB7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
    dots+xLabels;
}

function renderFeatures(){
  var filtered=features
    .filter(function(f){return currentFilter==="All"||f.status===currentFilter})
    .sort(function(a,b){return b.votes-a.votes});
  document.getElementById("feat-count").textContent=filtered.length+" items";
  var body=document.getElementById("feat-body");
  body.innerHTML=filtered.map(function(f){
    var sc=f.status==="Shipped"?"status-shipped":f.status==="Building"?"status-building":"status-backlog";
    return '<tr>'+
      '<td style="font-weight:500;color:#212121">'+f.name+'</td>'+
      '<td>'+f.votes+'</td>'+
      '<td>'+f.effort+'</td>'+
      '<td><span class="status '+sc+'">'+f.status+'</span></td>'+
      '</tr>';
  }).join("");
}

function setRange(r,btn){
  currentRange=r;
  document.querySelectorAll(".range-btn").forEach(function(b){b.classList.remove("active")});
  btn.classList.add("active");
  renderKPIs();
  renderChart();
}

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll(".filter-btn").forEach(function(b){b.classList.remove("active")});
  btn.classList.add("active");
  renderFeatures();
}

renderKPIs();
renderChart();
renderFeatures();
window.addEventListener("resize",renderChart);
</script>
</body>
</html>
